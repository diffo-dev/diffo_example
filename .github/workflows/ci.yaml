name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Neo4j 2026.05 (Cypher 25 / BOLT 6.0) — the diffo 0.9.0 target. Same image
      # as docker-compose.yml, on the port config/test.exs expects. Community
      # edition, no volumes: the suite is ephemeral.
      neo4j:
        image: neo4j:2026.05.0-community-ubi10
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # Erlang/Elixir come from .tool-versions, keeping CI in lockstep with the
      # toolchain the repo (and upstream diffo) develops against.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Test
        # --max-cases 1 runs tests serially so each gets full CPU. The
        # AshNeo4j.Sandbox holds one connection (an open transaction) per test for
        # the whole test, inheriting DBConnection's 15s checkout default; under
        # concurrency on the runner's limited cores a heavy test's wall-clock
        # exceeds 15s and the pool disconnects it (--max-cases 2 still flaked).
        # Serial keeps wall-clock ≈ CPU time, under the cap. Proper fix is upstream
        # — see ash_neo4j#398 (sandbox should pass a generous :timeout).
        run: mix test --max-cases 1
