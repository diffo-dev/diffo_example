name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Neo4j 2026.06 (Cypher 25 / BOLT 6.0) — the diffo 0.9.0 target, and the
      # newest release bolty exercises its Bolt 6 server against. Same image as
      # docker-compose.yml, on the port config/test.exs expects. Community
      # edition, no volumes: the suite is ephemeral.
      neo4j:
        image: neo4j:2026.06.0-community-ubi10
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # Erlang/Elixir come from .tool-versions, keeping CI in lockstep with the
      # toolchain the repo (and upstream diffo) develops against.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Test
        run: mix test
